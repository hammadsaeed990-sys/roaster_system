{% extends "base.html" %}{% block title %}Rosters{% endblock %}
{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h1>Rosters</h1><div><a class="btn btn-outline-dark" href="{{ url_for('dashboard') }}">Dashboard</a> <a class="btn btn-dark" href="{{ url_for('create_roster') }}">Create</a></div></div>
<div class="card p-4"><div class="table-responsive"><table class="table align-middle"><tr><th>Employee</th><th>Week</th><th>Actions</th></tr>{% for r in rosters %}<tr><td>{{r.employee.name}}</td><td>{{r.week_start}}</td><td><a class="btn btn-sm btn-dark" href="{{url_for('view_roster',roster_id=r.id)}}">View</a> <form class="d-inline" method="post" action="{{url_for('delete_roster',roster_id=r.id)}}" onsubmit="return confirm('Delete this roster?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="3">No rosters.</td></tr>{% endfor %}</table></div></div>{% endblock %}
