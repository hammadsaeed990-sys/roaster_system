{% extends "base.html" %}

{% block title %}Create Roster{% endblock %}

{% block content %}

<form method="POST">

    <!-- Employee + Week -->
    <div class="row g-3 mb-4">

        <div class="col-md-6">

            <label class="form-label">
                Employee
            </label>

            <select
                class="form-select"
                name="employee_id"
                required
            >

                <option value="">
                    Select employee
                </option>

                {% for e in employees %}

                    <option value="{{ e.id }}">
                        {{ e.name }} — {{ e.email }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="col-md-6">

            <label class="form-label">
                Week starting (Monday)
            </label>

            <input
                class="form-control"
                type="date"
                name="week_start"
                required
            >

        </div>

    </div>


    <!-- Weekly Shifts + Locations -->

    <div class="row g-3">

        {% for day in days %}

        <div class="col-md-6">

            <div class="card p-3 h-100">

                <h5 class="text-capitalize mb-3">
                    {{ day }}
                </h5>


                <!-- Shift -->

                <label class="form-label">
                    Shift
                </label>

                <input
                    class="form-control mb-3"
                    name="{{ day }}"
                    value="OFF"
                    placeholder="08:00-16:00 or OFF"
                >


                <!-- Location -->

                <label class="form-label">
                    Location
                </label>

                <input
                    class="form-control"
                    name="{{ day }}_location"
                    placeholder="e.g. Dublin Office, Navan Site"
                >

            </div>

        </div>

        {% endfor %}

    </div>


    <!-- Save -->

    <button
        type="submit"
        class="btn btn-dark mt-4"
    >
        Save Roster
    </button>

</form>

{% endblock %}
