{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5">
<div class="card p-4">
<h2 class="mb-3">Employee Roster Login</h2>
<form method="post">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-dark w-100">Login</button>
</form>
<p class="text-muted small mt-3 mb-0">Demo admin: admin@roster.local / admin123</p>
</div></div></div>
{% endblock %}
